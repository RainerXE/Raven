<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you — Raven</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./raven.css">
<script src="./raven-glass.js" defer></script>
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.card{position:relative;z-index:1;max-width:560px;padding:44px 40px;border-radius:36px;text-align:center;animation:pop .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.tick{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
h1{font-size:40px}
p{color:var(--mut);font-weight:600;margin-top:14px}
a.btn{margin-top:26px}
</style>
</head>
<body>
<div class="bg"><i style="left:-6%;top:-10%;background:#4f7dff"></i><i style="right:-8%;bottom:-12%;background:#ff4f9a"></i></div>
<div class="card glass">
	<div class="tick">✓</div>
	<h1>Thank you!</h1>
	<p>Your payment went through. Your license file is on its way to your inbox (check the spam folder if it isn't there in a few minutes).</p>
	<p>Build with <code>-DRAVEN_LICENSE_FILE=path/to/raven.raven-license</code> — no more watermark.</p>
	<p>A question? <a href="mailto:oscarsoirey.contact@gmail.com">oscarsoirey.contact@gmail.com</a></p>
	<a class="btn p" href="./index.html">Back to Raven</a>
</div>
</body>
</html>
