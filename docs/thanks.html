<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you — Raven</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#f5f5f7;--mut:#86868b;--glass:rgba(255,255,255,.08);--rim:rgba(255,255,255,.22);--tag:#7aa7ff;--acc:rgba(120,160,255,.55)}
@media (prefers-color-scheme:light){:root{--bg:#fff;--fg:#1d1d1f;--mut:#6e6e73;--glass:rgba(255,255,255,.55);--rim:rgba(0,0,0,.10);--tag:#2f5fd0;--acc:rgba(90,130,255,.85)}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--fg);font:500 16px/1.6 "Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.bg i{position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(110px);opacity:.3;pointer-events:none}
.card{position:relative;max-width:560px;padding:44px 40px;border-radius:36px;text-align:center;background:var(--glass);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--rim);animation:pop .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.tick{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
h1{font-size:40px;letter-spacing:-.05em;line-height:1.05}
p{color:var(--mut);font-weight:600;margin-top:14px}
code{font:600 13px ui-monospace,Menlo,Consolas,monospace;color:var(--tag)}
a.btn{display:inline-block;margin-top:26px;padding:13px 26px;border-radius:99px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600}
a{color:var(--tag)}
</style>
</head>
<body>
<div class="bg"><i style="left:-6%;top:-10%;background:#4f7dff"></i><i style="right:-8%;bottom:-12%;background:#ff4f9a"></i></div>
<div class="card">
	<div class="tick">✓</div>
	<h1>Thank you!</h1>
	<p>Your payment went through. Your Raven license will be sent to the email you gave Stripe.</p>
	<p>With it, build the Release edition: <code>-DRAVEN_EDITION=Release</code> — no more watermark.</p>
	<p>A question? <a href="mailto:oscarsoirey.contact@gmail.com">oscarsoirey.contact@gmail.com</a></p>
	<a class="btn" href="./license.html#build">How to build it</a>
</div>
</body>
</html>
