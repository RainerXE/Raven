name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------- Windows / MSVC ----------------
          - name: windows-msvc-static
            os: windows-latest
            toolchain: msvc
            shared: OFF
            extra: -DRAVEN_MSVC_STATIC_RUNTIME=ON
          - name: windows-msvc-dynamic
            os: windows-latest
            toolchain: msvc
            shared: ON
            extra: -DRAVEN_MSVC_STATIC_RUNTIME=OFF
          # ---------------- Windows / MinGW ---------------
          - name: windows-mingw-static
            os: windows-latest
            toolchain: mingw
            shared: OFF
            extra: >-
              "-DCMAKE_EXE_LINKER_FLAGS=-static -static-libgcc"
          - name: windows-mingw-dynamic
            os: windows-latest
            toolchain: mingw
            shared: ON
            extra: ""
          # ---------------- Linux -------------------------
          - name: linux-static
            os: ubuntu-latest
            toolchain: unix
            shared: OFF
            extra: -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          - name: linux-dynamic
            os: ubuntu-latest
            toolchain: unix
            shared: ON
            extra: ""
          # ---------------- macOS (universal) -------------
          - name: macos-static
            os: macos-latest
            toolchain: unix
            shared: OFF
            extra: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
          - name: macos-dynamic
            os: macos-latest
            toolchain: unix
            shared: ON
            extra: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'

    steps:
      - uses: actions/checkout@v4

      # ---- dependencies ----
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev xvfb

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MinGW (MSYS2 UCRT64)
        if: matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # ---- configure / build / test / install ----
      - name: Build (MSVC / Linux / macOS)
        if: matrix.toolchain != 'mingw'
        shell: bash
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRAVEN_BUILD_SHARED=${{ matrix.shared }} \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist/raven-${{ matrix.name }}" \
            ${{ matrix.extra }}
          cmake --build build/ci --parallel

      - name: Build (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRAVEN_BUILD_SHARED=${{ matrix.shared }} \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist/raven-${{ matrix.name }}" \
            ${{ matrix.extra }}
          cmake --build build/ci --parallel

      # Tests: a clean, long temporary folder (no 8.3 name, no trailing separator).
      # The browser half of test_web runs on Linux only (see the web-diagnostics job).
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          TMPDIR: ${{ runner.temp }}
        run: cd build/ci && xvfb-run -a ctest --output-on-failure

      - name: Test (macOS / MSVC)
        if: runner.os != 'Linux' && matrix.toolchain != 'mingw'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then T=$(cygpath -w "$RUNNER_TEMP"); else T="$RUNNER_TEMP"; fi
          export TMPDIR="$T" TEMP="$T" TMP="$T"
          export RAVEN_WEB_BROWSER="$RUNNER_TEMP/no-browser-in-ci"
          cd build/ci && ctest --output-on-failure

      - name: Test (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          T=$(cygpath -w "$RUNNER_TEMP")
          export TMPDIR="$T" TEMP="$T" TMP="$T"
          export RAVEN_WEB_BROWSER="$T\\no-browser-in-ci"
          cd build/ci && ctest --output-on-failure

      - name: Install
        if: matrix.toolchain != 'mingw'
        shell: bash
        run: cmake --install build/ci

      - name: Install (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: cmake --install build/ci

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: raven-${{ matrix.name }}
          path: dist/raven-${{ matrix.name }}
          if-no-files-found: error

  # Runs the browser tests of raven_web on Windows and macOS with traces.
  # It never blocks the build: its log is what is needed to fix them there.
  web-diagnostics:
    name: web-diagnostics-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build test_web
        shell: bash
        run: |
          cmake -S . -B build/diag -G Ninja -DCMAKE_BUILD_TYPE=Release -DRAVEN_BUILD_EXAMPLES=OFF -DRAVEN_BUILD_TOOLS=OFF
          cmake --build build/diag --target test_web --parallel
      - name: Run test_web with traces
        shell: bash
        env:
          RAVEN_WEB_TRACE: "1"
          RAVEN_WEB_DEBUG: "1"
        run: |
          if [ "$RUNNER_OS" = Windows ]; then T=$(cygpath -w "$RUNNER_TEMP"); else T="$RUNNER_TEMP"; fi
          export TMPDIR="$T" TEMP="$T" TMP="$T"
          cd build/diag && ./bin/test_web 2>&1 | tee test_web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-diagnostics-${{ matrix.os }}
          path: build/diag/test_web.log

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          cd dist
          for d in */; do d=${d%/}; tar czf "$d.tar.gz" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
