name = "raven-license"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[vars]
# Polar dashboard > Products > (the product) > the id in the URL / "Copy ID"
PRODUCT_PERSONAL = "REPLACE_WITH_PERSONAL_PRODUCT_ID"
PRODUCT_COMPANY = "REPLACE_WITH_COMPANY_PRODUCT_ID"
# a sender on a domain verified in resend.com (Domains)
MAIL_FROM = "Raven <license@REPLACE-WITH-YOUR-DOMAIN>"
# you: a copy of every license, and the address buyers reply to
MAIL_BCC = "oscarsoirey.contact@gmail.com"
COMPANY_GRACE_DAYS = "5"

# Polar retries a webhook that did not answer 200: this remembers the orders already served.
# Create it with:  npx wrangler kv namespace create LICENSES   then paste the id below.
[[kv_namespaces]]
binding = "LICENSES"
id = "REPLACE_WITH_KV_ID"

# Secrets (never in this file):
#   npx wrangler secret put POLAR_WEBHOOK_SECRET
#   npx wrangler secret put RAVEN_SIGNING_SECRET
#   npx wrangler secret put RAVEN_UNLOCK_KEY
#   npx wrangler secret put RESEND_API_KEY
