<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Raven</title>
<style>
	/* the canvas is the window: it fills the page, and Raven follows its size */
	html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; overscroll-behavior: none; }
	#canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
	#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 14px system-ui, sans-serif; color: #9aa0ab; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<script>
	var Module = {
		canvas: document.getElementById('canvas'),
		print: function (text) { console.log(text); },
		printErr: function (text) { console.error(text); },
		setStatus: function (text) { document.getElementById('status').textContent = text; if (!text) document.getElementById('status').remove(); },
		onAbort: function (what) { var s = document.getElementById('status'); if (s) s.textContent = 'Stopped: ' + what; }
	};
</script>
{{{ SCRIPT }}}
</body>
</html>
